services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ehr_db
      POSTGRES_USER: ehr_admin
      POSTGRES_PASSWORD: ehr_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Auto-run migrations on first boot
      - ./ehr-blockchain/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ehr_admin -d ehr_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./ehr-blockchain
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ./ehr-blockchain/.env
    environment:
      SERVER_HOST: 0.0.0.0
      DATABASE_URL: postgresql://ehr_admin:ehr_password@db:5432/ehr_db
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./ehr-blockchain/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
